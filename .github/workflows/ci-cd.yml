name: Nexa Capital Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci

      - name: Run TypeScript Type Check & Linter
        run: npm run lint

      - name: Build Application (Frontend Vite + Backend Esbuild)
        run: npm run build
        env:
          NODE_ENV: production

      - name: Build Docker Container Image
        run: docker build -t nexa-capital-app:latest .
